name: Build and Push Docker Image

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra image tag (optional)'
        required: false
        default: ''

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/kiro-rs"
          short_sha="${GITHUB_SHA::12}"
          tags="${image}:sha-${short_sha}"

          if [[ "${GITHUB_REF}" == "refs/heads/master" ]]; then
            tags="${tags},${image}:latest"
          fi

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tags="${tags},${image}:${GITHUB_REF_NAME}"
            tags="${tags},${image}:latest"
          fi

          extra="${{ github.event.inputs.tag }}"
          if [[ -n "${extra}" ]]; then
            tags="${tags},${image}:${extra}"
          fi

          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            ENABLE_NATIVE_TLS=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Kiro.rs Docker image for CentOS VPS
